<!DOCTYPE html>
<html>
<head>
    <title>Sports ML Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Sports ML Prediction System</h1>

    <label>Age</label>
    <input type="number" id="age" value="24">

    <label>Sport Type</label>
    <input type="number" id="sport_type" value="1">

    <label>Position</label>
    <input type="number" id="position" value="1">

    <label>Experience Years</label>
    <input type="number" id="experience_years" value="3">

    <label>Height (cm)</label>
    <input type="number" id="height_cm" value="175">

    <label>Weight (kg)</label>
    <input type="number" id="weight_kg" value="70">

    <label>Strength Score</label>
    <input type="number" id="strength_score" value="80">

    <label>Matches Played</label>
    <input type="number" id="matches_played" value="20">

    <label>Goals Scored</label>
    <input type="number" id="goals_scored" value="10">

    <label>Assists</label>
    <input type="number" id="assists" value="5">

    <label>Training Hours Per Week</label>
    <input type="number" id="training_hours_per_week" value="15">

    <label>Gym Sessions Per Week</label>
    <input type="number" id="gym_sessions_per_week" value="4">

    <label>Injury History Count</label>
    <input type="number" id="injury_history_count" value="1">

    <label>Leadership Score</label>
    <input type="number" id="leadership_score" value="75">

    <label>Decision Making Score</label>
    <input type="number" id="decision_making_score" value="80">

    <label>Teamwork Score</label>
    <input type="number" id="teamwork_score" value="85">

    <label>Team Ranking</label>
    <input type="number" id="team_ranking" value="5">

    <label>Player Performance Score</label>
    <input type="number" id="player_performance_score" value="70">

    <label>Player Rating</label>
    <input type="number" id="player_rating" value="8">

    <br><br>

    <button onclick="predictPerformance()">
        Predict Player Performance
    </button>

    <button onclick="predictInjury()">
        Predict Injury Risk
    </button>

    <h2>Prediction Result</h2>

    <div id="result">
        Result will appear here
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
